<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'"><title>菜单</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="menu.css"></head>
<body>
<div class="card menu" role="menu" aria-label="蓝色肥鱼菜单">
  <div class="row size">
    <span class="ico" data-icon="size" title="大小" aria-hidden="true"></span>
    <input id="size" class="range" type="range" min="150" max="460" step="1" value="240" aria-label="大小">
    <output id="sizeValue" class="num">240</output>
  </div>
  <div class="row controls">
    <button class="icon-btn" id="follow" aria-pressed="true" title="跟随鼠标" aria-label="跟随鼠标"><span data-icon="follow"></span></button>
    <button class="icon-btn" id="idle" aria-pressed="true" title="自然待机" aria-label="自然待机"><span data-icon="idle"></span></button>
    <button class="icon-btn" id="docked" aria-pressed="true" title="趴在状态栏" aria-label="趴在状态栏"><span data-icon="dock"></span></button>
  </div>
  <div class="row utilities">
    <button class="icon-btn" data-command="chat" title="说话" aria-label="说话"><span data-icon="chat"></span></button>
    <button class="icon-btn" data-command="toggle-visible" title="隐藏" aria-label="隐藏"><span data-icon="hide"></span></button>
    <button class="icon-btn danger last" data-command="quit" title="退出" aria-label="退出"><span data-icon="quit"></span></button>
  </div>
</div>
<script type="module" src="src/menu.mjs"></script>
</body></html>
