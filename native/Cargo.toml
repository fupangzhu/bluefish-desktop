[package]
name = "bluefish"
version = "0.1.0"
edition = "2021"
description = "Bluefish desktop pet, native Windows build"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bluefish"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
# 0.1.27 links through windows-targets import libraries; later ones need dlltool on the GNU toolchain.
schannel = "=0.1.27"
base64 = "0.22"
aes-gcm = "0.10"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Foundation_Numerics",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_UI_Input_Ime",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_UI_Controls",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_Time",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Golden tests replay thousands of frames; keep them quick without a full release build.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
