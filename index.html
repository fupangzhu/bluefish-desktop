<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'"><title>蓝色肥鱼</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="strip"><span class="brand" data-icon="brand" aria-hidden="true"></span></div>
<main class="shell">
  <section class="stage" id="stage">
    <canvas id="avatar" aria-label="蓝发肥鱼动态角色"></canvas>
    <span class="status" id="statusWrap" title="正在准备角色"><i class="dot" id="status" data-state="working"></i></span>
    <button class="icon-btn stage-btn" id="background" title="切换浅色背景" aria-label="切换浅色背景"><span data-icon="sun"></span></button>
  </section>
  <aside class="rail" id="rail">
    <section class="card" id="sizeCard">
      <div class="line">
        <span class="ico" data-icon="size" title="大小" aria-hidden="true"></span>
        <output class="num" id="sizeValue">460</output>
      </div>
      <input id="size" class="range" type="range" min="150" max="460" step="1" value="460" aria-label="大小">
    </section>
    <section class="card preview-card">
      <div class="preview-buttons">
        <button class="preview-button" data-preview="snub_l">向左侧瞥</button>
        <button class="preview-button" data-preview="snub_r">向右侧瞥</button>
        <button class="preview-button" data-preview="normal">正常醒来</button>
        <button class="preview-button" data-preview="peek">假醒</button>
        <button class="preview-button" data-preview="rub_l">左手揉眼</button>
        <button class="preview-button" data-preview="rub_r">右手揉眼</button>
        <button class="preview-button" data-preview="ear_l">左耳短抖</button>
        <button class="preview-button" data-preview="ear_r">右耳短抖</button>
        <button class="preview-button" data-preview="sleep">睡眠</button>
        <button class="preview-button" data-preview="breath">慢呼吸</button>
        <button class="preview-button" data-preview="hair_ltr">呆毛左→右</button>
        <button class="preview-button" data-preview="hair_rtl">呆毛右→左</button>
        <button class="preview-button" data-preview="blink">眨眼</button>
        <button class="preview-button" data-preview="fringe">轻拨刘海</button>
        <button class="preview-button" data-preview="tug_guard">拽呆毛护头</button>
        <button class="preview-button" data-preview="bonk">双击捂头下躲</button>
        <button class="preview-button" data-preview="tow">拽呆毛走</button>
        <button class="preview-button" data-preview="dip">拽走后下躲</button>
        <button class="preview-button" data-preview="slump_l">靠左墙发呆</button>
        <button class="preview-button" data-preview="slump_r">靠右墙发呆</button>
      </div>
      <div id="previewTransport" hidden>
        <input class="range" id="previewTimeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="动画进度">
        <div class="preview-controls"><button class="preview-button" id="previewPlay">暂停</button><output id="previewTime" class="num"></output><select id="previewRate" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
      </div>
    </section>
    <section class="card">
      <div class="axis"><div class="line"><span class="ico" data-icon="yaw" title="左右转头" aria-hidden="true"></span><output class="num" id="yawValue" title="双击归零">0.0°</output></div><input id="yaw" class="range" type="range" min="-8" max="18" step="0.1" value="0" aria-label="左右转头"></div>
      <div class="axis"><div class="line"><span class="ico" data-icon="pitch" title="抬头 / 低头" aria-hidden="true"></span><output class="num" id="pitchValue" title="双击归零">0.0°</output></div><input id="pitch" class="range" type="range" min="-12" max="12" step="0.1" value="0" aria-label="抬头 / 低头"></div>
      <div class="axis"><div class="line"><span class="ico" data-icon="roll" title="歪头" aria-hidden="true"></span><output class="num" id="rollValue" title="双击归零">0.0°</output></div><input id="roll" class="range" type="range" min="-10" max="10" step="0.1" value="0" aria-label="歪头"></div>
    </section>
    <section class="card">
      <div class="pills">
        <button class="pill" data-action="blink" title="眨眼" aria-label="眨眼"><span data-icon="blink"></span></button>
        <button class="pill" data-action="wink" title="单眼眨眼" aria-label="单眼眨眼"><span data-icon="wink"></span></button>
        <button class="pill" data-action="nod" title="点头" aria-label="点头"><span data-icon="nod"></span></button>
        <button class="pill" data-action="shakehead" title="摇头" aria-label="摇头"><span data-icon="shake"></span></button>
        <button class="pill" data-action="happy" title="开心" aria-label="开心"><span data-icon="happy"></span></button>
        <button class="pill" id="reset" title="恢复自然姿态" aria-label="恢复自然姿态"><span data-icon="reset"></span></button>
      </div>
    </section>
    <section class="card">
      <div class="toggles">
        <button class="icon-btn" id="follow" aria-pressed="true" title="跟随鼠标" aria-label="跟随鼠标"><span data-icon="follow"></span></button>
        <button class="icon-btn" id="idle" aria-pressed="true" title="自然待机与眨眼" aria-label="自然待机与眨眼"><span data-icon="idle"></span></button>
        <button class="icon-btn" id="reduced" aria-pressed="false" title="减少动态" aria-label="减少动态"><span data-icon="reduced"></span></button>
      </div>
    </section>
    <section class="card adv" id="adv" data-open="false">
      <div class="line">
        <span class="ico" data-icon="layers" title="高级" aria-hidden="true"></span>
        <button class="icon-btn" id="advToggle" aria-expanded="false" aria-controls="advBody" title="展开高级选项" aria-label="展开高级选项"><span data-icon="chevron"></span></button>
      </div>
      <div class="adv-body" id="advBody" hidden>
        <select id="soloLayer" aria-label="单独查看图层" title="单独查看图层"><option value="">—</option></select>
        <div class="tools">
          <button class="icon-btn" id="showMaster" aria-pressed="false" title="对照完整母版" aria-label="对照完整母版"><span data-icon="compare"></span></button>
          <button class="icon-btn" id="uploadCue" title="导入动作 JSON" aria-label="导入动作 JSON"><span data-icon="upload"></span></button>
          <button class="icon-btn" id="demoCue" title="播放适配示例" aria-label="播放适配示例"><span data-icon="play"></span></button>
          <input id="cueFile" type="file" accept=".json,application/json" hidden>
        </div>
      </div>
    </section>
  </aside>
</main>
<script type="module" src="src/app.mjs"></script>
</body></html>
